---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: flux-system
spec:
  interval: 30m

  chartRef:
    kind: OCIRepository
    name: k8s-gateway
    namespace: flux-system

  targetNamespace: k8s-gateway

  install:
    createNamespace: true

  values:
    domain: home.arpa

    ttl: 300

    watchedResources:
      - Ingress

    extraZonePlugins:
      - name: log
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . 192.168.0.1
      - name: loop
      - name: reload
      - name: loadbalance

    service:
      type: LoadBalancer
      port: 53
      useTcp: true
