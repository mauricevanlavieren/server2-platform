---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: flux-system
spec:
  interval: 30m

  chart:
    spec:
      chart: k8s-gateway
      version: "2.4.0"
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system

  targetNamespace: k8s-gateway

  install:
    createNamespace: true

  values:
    domain: home.arpa

    ttl: 300

    watchedResources:
      - Ingress

    service:
      type: LoadBalancer
      port: 53
      loadBalancerIP: 192.168.0.162
      useTcp: true
