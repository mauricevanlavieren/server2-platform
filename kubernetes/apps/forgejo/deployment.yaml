---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  # Activated with owner approval; secrets reconciled before app startup.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure
          # 15.0.9-rootless LTS, registry index digest verified 2026-10-09.
          image: codeberg.org/forgejo/forgejo:15.0.9-rootless@sha256:caf1bca332f95cdcf124227a4bfa3b49bbbfbbc8a5e4a97406921cb581165413
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/lib/gitea/custom/conf /var/lib/gitea/git /var/lib/gitea/data
              cp /config/app.ini /var/lib/gitea/custom/conf/app.ini
              chmod 0600 /var/lib/gitea/custom/conf/app.ini
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config
              mountPath: /config
              readOnly: true
            - name: ingress-certificate
              mountPath: /run/forgejo-tls
              readOnly: true
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15.0.9-rootless@sha256:caf1bca332f95cdcf124227a4bfa3b49bbbfbbc8a5e4a97406921cb581165413
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # TCP liveness avoids restarting solely due to a slow DB health query.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: temporary
              mountPath: /tmp
            - name: runtime-secrets
              mountPath: /run/forgejo-secrets
              readOnly: true
      volumes:
        # A missing TLS Secret blocks pod startup as well as deployment preflight.
        # Mount only the public certificate, never the ingress private key.
        - name: ingress-certificate
          secret:
            secretName: forgejo-tls
            optional: false
            items:
              - key: tls.crt
                path: tls.crt
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: config
          configMap:
            name: forgejo-config
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
        - name: runtime-secrets
          secret:
            secretName: forgejo-runtime
            optional: false
            defaultMode: 0440
            items:
              - key: secret_key
                path: secret_key
              - key: internal_token
                path: internal_token
              - key: oauth2_jwt_secret
                path: oauth2_jwt_secret
