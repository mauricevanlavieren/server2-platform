---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-config
  namespace: forgejo
data:
  app.ini: |
    APP_NAME = Server2 Forgejo Test
    RUN_MODE = prod
    RUN_USER = git
    WORK_PATH = /var/lib/gitea

    [server]
    DOMAIN = forgejo.home.arpa
    ROOT_URL = https://forgejo.home.arpa/
    PROTOCOL = http
    HTTP_ADDR = 0.0.0.0
    HTTP_PORT = 3000
    APP_DATA_PATH = /var/lib/gitea/data
    DISABLE_SSH = true
    START_SSH_SERVER = false
    LFS_START_SERVER = false

    [database]
    DB_TYPE = sqlite3
    PATH = /var/lib/gitea/data/forgejo.db
    SQLITE_JOURNAL_MODE = WAL

    [repository]
    ROOT = /var/lib/gitea/git/repositories
    DEFAULT_PRIVATE = private

    [security]
    INSTALL_LOCK = true
    SECRET_KEY_URI = file:/run/forgejo-secrets/secret_key
    INTERNAL_TOKEN_URI = file:/run/forgejo-secrets/internal_token
    REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.0/8,::1/128,10.42.0.0/16
    REVERSE_PROXY_LIMIT = 1
    DISABLE_GIT_HOOKS = true
    DISABLE_WEBHOOKS = true
    IMPORT_LOCAL_PATHS = false

    [service]
    DISABLE_REGISTRATION = true
    REQUIRE_SIGNIN_VIEW = true
    ENABLE_REVERSE_PROXY_AUTHENTICATION = false
    ENABLE_REVERSE_PROXY_AUTO_REGISTRATION = false

    [session]
    COOKIE_SECURE = true
    SAME_SITE = lax

    [oauth2]
    ENABLED = false
    JWT_SIGNING_ALGORITHM = HS256
    JWT_SECRET_URI = file:/run/forgejo-secrets/oauth2_jwt_secret

    [actions]
    ENABLED = false

    [mailer]
    ENABLED = false

    [metrics]
    ENABLED = false

    [log]
    MODE = console
    LEVEL = Info
