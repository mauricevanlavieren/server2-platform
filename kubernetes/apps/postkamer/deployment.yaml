{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "postkamer",
    "namespace": "postkamer"
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 2,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "postkamer"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "postkamer"
        },
        "annotations": {
          "postkamer.demo/ipv4-guard-sha256": "6377fd45c6348023e8edb8731f43acf24a1687b1c6d971dfe400010e78107b56",
          "postkamer.demo/exception-expires-at": "2026-10-20T17:19:30Z",
          "postkamer.demo/cleanup-owner": "mauricevanlavieren"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "terminationGracePeriodSeconds": 20,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001,
          "fsGroupChangePolicy": "OnRootMismatch",
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "postkamer",
            "image": "ghcr.io/mauricevanlavieren/postkamer@sha256:a693c575a290dec1cd857e750c07a6752afd8558de2351e2920e24be37b92773",
            "imagePullPolicy": "Always",
            "ports": [
              {
                "name": "http",
                "containerPort": 8765
              }
            ],
            "env": [
              {
                "name": "POSTKAMER_BIND",
                "value": "0.0.0.0"
              },
              {
                "name": "POSTKAMER_PORT",
                "value": "8765"
              },
              {
                "name": "POSTKAMER_DB",
                "value": "/data/demo.sqlite"
              },
              {
                "name": "POSTKAMER_ALLOWED_HOSTS",
                "value": "127.0.0.1:8765,localhost:8765,127.0.0.1:8766,localhost:8766"
              },
              {
                "name": "PYTHONDONTWRITEBYTECODE",
                "value": "1"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi",
                "ephemeral-storage": "16Mi"
              },
              "limits": {
                "cpu": "250m",
                "memory": "256Mi",
                "ephemeral-storage": "64Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "/usr/local/bin/python",
                  "-I",
                  "-B",
                  "/guard/ipv4_guard.py",
                  "--healthcheck"
                ]
              },
              "periodSeconds": 5,
              "timeoutSeconds": 5,
              "failureThreshold": 24
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "/usr/local/bin/python",
                  "-I",
                  "-B",
                  "/guard/ipv4_guard.py",
                  "--healthcheck"
                ]
              },
              "periodSeconds": 10,
              "timeoutSeconds": 5,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "/usr/local/bin/python",
                  "-I",
                  "-B",
                  "/guard/ipv4_guard.py",
                  "--healthcheck"
                ]
              },
              "periodSeconds": 20,
              "timeoutSeconds": 5,
              "failureThreshold": 6
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              },
              {
                "name": "ipv4-guard",
                "mountPath": "/guard",
                "readOnly": true
              }
            ],
            "command": [
              "/usr/local/bin/python",
              "-I",
              "-B",
              "/guard/ipv4_guard.py"
            ],
            "args": []
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "postkamer-data"
            }
          },
          {
            "name": "ipv4-guard",
            "configMap": {
              "name": "postkamer-ipv4-6377fd45c634",
              "defaultMode": 292
            }
          }
        ],
        "imagePullSecrets": [
          {
            "name": "postkamer-ghcr-pull"
          }
        ]
      }
    }
  }
}
