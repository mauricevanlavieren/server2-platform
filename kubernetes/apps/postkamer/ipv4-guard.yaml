    "ipv4_guard.py": "\"\"\"Add an irreversible IPv6 socket restriction on top of RuntimeDefault (amd64).\nNo external packages, node files, privileges or configuration changes.\n\"\"\"\nimport ctypes\nimport errno\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport sys\n\nclass ArgCmp(ctypes.Structure):\n    _fields_=[('arg',ctypes.c_uint),('op',ctypes.c_int),('a',ctypes.c_uint64),('b',ctypes.c_uint64)]\n\ndef status():\n    values=dict(line.split(':',1) for line in Path('/proc/self/status').read_text().splitlines() if ':' in line)\n    return {k:values[k].strip() for k in ['NoNewPrivs','Seccomp','Seccomp_filters','CapEff','CapPrm','CapAmb']}\n\ndef install():\n    if platform.machine()!='x86_64':raise RuntimeError('Unsupported architecture; STOP')\n    before=status()\n    if before['NoNewPrivs']!='1' or before['Seccomp']!='2' or int(before['Seccomp_filters'])<1:\n        raise RuntimeError('Missing no-new-privileges or base seccomp; STOP')\n    if any(int(before[k],16) for k in ['CapEff','CapPrm','CapAmb']):raise RuntimeError('Unexpected capabilities; STOP')\n    for fd in Path('/proc/self/fd').iterdir():\n        try:target=os.readlink(fd)\n        except FileNotFoundError:continue\n        if target.startswith('socket:'):raise RuntimeError('Inherited socket descriptor; STOP')\n    lib=ctypes.CDLL('libseccomp.so.2',use_errno=True)\n    lib.seccomp_init.argtypes=[ctypes.c_uint32];lib.seccomp_init.restype=ctypes.c_void_p\n    lib.seccomp_release.argtypes=[ctypes.c_void_p];lib.seccomp_release.restype=None\n    lib.seccomp_attr_set.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.c_uint32];lib.seccomp_attr_set.restype=ctypes.c_int\n    lib.seccomp_syscall_resolve_name.argtypes=[ctypes.c_char_p];lib.seccomp_syscall_resolve_name.restype=ctypes.c_int\n    lib.seccomp_rule_add_array.argtypes=[ctypes.c_void_p,ctypes.c_uint32,ctypes.c_int,ctypes.c_uint,ctypes.POINTER(ArgCmp)];lib.seccomp_rule_add_array.restype=ctypes.c_int\n    lib.seccomp_load.argtypes=[ctypes.c_void_p];lib.seccomp_load.restype=ctypes.c_int\n    ctx=lib.seccomp_init(0x7fff0000) # ALLOW only in the additional filter.\n    if not ctx:raise RuntimeError('seccomp_init failed; STOP')\n    def check(rc):\n        if rc!=0:raise RuntimeError('seccomp operation failed: '+str(rc)+'; STOP')\n    try:\n        check(lib.seccomp_attr_set(ctx,2,0x80000000)) # bad ABI: KILL_PROCESS\n        check(lib.seccomp_attr_set(ctx,4,1)) # TSYNC\n        for name in [b'socket',b'socketpair']:\n            nr=lib.seccomp_syscall_resolve_name(name)\n            if nr<0:raise RuntimeError('Unknown syscall; STOP')\n            cmp=ArgCmp(0,7,0xffffffff,10) # MASKED_EQ: kernel domain is a 32-bit int\n            check(lib.seccomp_rule_add_array(ctx,0x00050000|errno.EAFNOSUPPORT,nr,1,ctypes.byref(cmp)))\n        check(lib.seccomp_load(ctx))\n    finally:lib.seccomp_release(ctx)\n    after=status()\n    if after['NoNewPrivs']!='1' or after['Seccomp']!='2' or int(after['Seccomp_filters'])<=int(before['Seccomp_filters']):\n        raise RuntimeError('Additional filter not proven; STOP')\n    return {'before':before,'after':after,'uid':os.getuid(),'gid':os.getgid()}\n\ndef target(args):\n    if args==[]:return 'maildemo'\n    if args==['--healthcheck']:return 'maildemo.healthcheck'\n    raise RuntimeError('Unsupported invocation; STOP')\n\nif __name__=='__main__':\n    module=target(sys.argv[1:])\n    print(json.dumps({'ipv4_guard':install()}),flush=True)\n    os.execv(sys.executable,[sys.executable,'-B','-m',module])\n"
  }
