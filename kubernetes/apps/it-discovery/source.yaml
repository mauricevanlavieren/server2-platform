    "features.py": "\"\"\"Kompas v1: persistent fictional projects, telemetry alerts and evidence reports.\"\"\"\nimport json,time,html,urllib.parse,threading,hashlib\nfrom pathlib import Path\nSTEPS=['Nieuwe opdracht','Intake','Scope & toestemming','Discovery','Inventarisatie','Visualisatie','Risicoanalyse','Advies','Verbeterplan','Menselijke goedkeuring','Uitvoering (registratie)','Validatie','Opleverrapport','Nazorg']\nSTATUSES=['Nog niet begonnen','Bezig','Wacht op goedkeuring','Afgerond','Geblokkeerd']\nKINDS={'technical':'Technische nulmeting','inventory':'IT-inventarisatie','risk':'Security-risicoanalyse','advice':'Verbeteradvies','installation':'Implementatieplan','management':'Managementsamenvatting','delivery':'Opleverrapport'}\nFIELDS=('customer','description','scope','consent','assets','findings','risks','recommendations','approved_by','execution_plan','rollback_plan','report','aftercare')\ndef setup(a):\n global app\n app=a\n with app.db() as c:c.executescript('CREATE TABLE IF NOT EXISTS projects(id INTEGER PRIMARY KEY, content TEXT NOT NULL, updated REAL);CREATE TABLE IF NOT EXISTS alerts(id TEXT PRIMARY KEY,bad INTEGER,good INTEGER,active INTEGER,message TEXT,observed REAL);CREATE TABLE IF NOT EXISTS telemetry(time REAL,content TEXT);')\ndef validate_project(data):\n if not isinstance(data,dict) or data.get('synthetic') is not True:raise ValueError('Only fictional projects')\n if set(data)-set(FIELDS)-{'synthetic','steps','id'}:raise ValueError('Unknown project field')\n p={k:data.get(k,'') for k in FIELDS}\n if any(not isinstance(v,str) or len(v)>6000 for v in p.values()) or not 1<=len(p['customer'])<=120:raise ValueError('Invalid project')\n steps=data.get('steps',[STATUSES[0]]*len(STEPS))\n if not isinstance(steps,list) or len(steps)!=len(STEPS) or any(x not in STATUSES for x in steps):raise ValueError('Invalid steps')\n if any(x==STATUSES[3] for x in steps[2:]) and not p['consent'].strip():raise ValueError('Recorded consent required')\n if any(x==STATUSES[3] for x in steps[9:]) and not p['approved_by'].strip():raise ValueError('Named human decision required')\n if steps[10]==STATUSES[3] and (steps[9]!=STATUSES[3] or not p['execution_plan'].strip() or not p['rollback_plan'].strip()):raise ValueError('Approval, execution and rollback plan required')\n p.update(synthetic=True,steps=steps);return p\ndef projects():\n with app.db() as c:return [dict(json.loads(r['content']),id=r['id'],updated=r['updated']) for r in c.execute('SELECT * FROM projects ORDER BY id DESC')]\ndef save_project(data):\n p=validate_project(data);id=data.get('id')\n with app.db() as c:\n  if id is None:id=c.execute('INSERT INTO projects(content,updated) VALUES(?,?)',(json.dumps(p),time.time())).lastrowid\n  else:\n   if not isinstance(id,int) or c.execute('UPDATE projects SET content=?,updated=? WHERE id=?',(json.dumps(p),time.time(),id)).rowcount!=1:raise ValueError('Unknown project')\n  c.execute('INSERT INTO audit VALUES(?,?,?)',(time.time(),'project_saved','Fictional project '+str(id)+'; human decisions recorded, never executed'))\n return id\ndef host():\n path=Path('/status/host.json')\n try:\n  d=json.loads(path.read_text());assert d['host']=='mau2' and isinstance(d['time'],(int,float));return d\n except (OSError,ValueError,KeyError,AssertionError):return {'status':'UNKNOWN','reason':'Host telemetry not yet installed/available','time':0,'backup':{},'filesystems':[],'smart':{'status':'UNKNOWN'}}\ndef evaluate(signals,now=None):\n now=now or time.time()\n with app.db() as c:\n  for key,(bad,message) in signals.items():\n   r=c.execute('SELECT * FROM alerts WHERE id=?',(key,)).fetchone();b=(r['bad'] if r else 0)+1 if bad else 0;g=0 if bad else (r['good'] if r else 0)+1;active=bool(r['active']) if r else False\n   if b>=3:active=True\n   if g>=2:active=False\n   c.execute('INSERT OR REPLACE INTO alerts VALUES(?,?,?,?,?,?)',(key,b,g,int(active),message,now))\ndef sample():\n h=host();s=app.state('live');now=time.time();signals={'host_stale':(now-h.get('time',0)>180,'Hostmetingen ontbreken of zijn ouder dan 3 minuten')}\n for name,result in h.get('availability',{}).items():signals['availability:'+name]=(result.get('status')!='PASS','HTTP/DNS beschikbaarheidscontrole mislukt: '+name)\n for fs in h.get('filesystems',[]):signals['disk:'+fs['path']]=(fs['percent']>=85,'Disk \u226585% gebruikt: '+fs['path'])\n b=h.get('backup',{});signals['backup']=(b.get('status')!='PASS' or now-b.get('time',0)>36*3600,'Backup mislukt, onbekend of ouder dan 36 uur')\n signals['node']=(not any(a['kind']=='node' and a['facts'].get('ready') and now-a['observed']<180 for a in s['assets']),'Node niet Ready of discovery ontbreekt')\n for a in s['assets']:\n  if a['kind']=='deployment':signals['app:'+a['name']]=(a['facts'].get('ready',0)<a['facts'].get('replicas',1),'Applicatie niet Ready: '+a['name']+' (Kubernetes-status, geen end-to-end bereikbaarheidstest)')\n history=s['history'];last=history[-1] if history else {};signals['cpu']=(last.get('cpu',0)>3400,'CPU langdurig boven 85% van vier cores')\n mem=h.get('memory',{});signals['ram']=(bool(mem) and mem.get('MemAvailable',0)<mem.get('MemTotal',1)*.15,'Beschikbaar RAM langdurig onder 15%')\n if h.get('smart',{}).get('status')=='FAIL':signals['smart']=(True,'SMART meldt diskproblemen')\n evaluate(signals,now)\n with app.db() as c:\n  c.execute('INSERT INTO telemetry VALUES(?,?)',(now,json.dumps(h)));c.execute('DELETE FROM telemetry WHERE time<?',(now-14*86400,))\ndef monitor():\n h=host();now=time.time()\n with app.db() as c:\n  alerts=[dict(r) for r in c.execute('SELECT * FROM alerts ORDER BY active DESC,id')];history=[{'time':r['time'],**json.loads(r['content'])} for r in c.execute('SELECT * FROM telemetry ORDER BY time DESC LIMIT 120')][::-1]\n return {'host':h,'stale':now-h.get('time',0)>180,'alerts':alerts,'history':history,'notifications':'PENDING: externe telefoonprovider/token vereist','hysteresis':'3 opeenvolgende minuutmetingen voor alarm; 2 voor herstel','availability_scope':'Host HTTP/DNS checks zijn begrensde echte controles; Kubernetes Ready blijft afzonderlijk bewijs','pvc_usage':'UNKNOWN: capaciteit bekend, werkelijk gebruik nog niet gemeten'}\ndef report(dataset,kind,project_id=None):\n if kind not in KINDS:raise ValueError('Unknown report')\n s=app.state(dataset);p=next((p for p in projects() if str(p['id'])==str(project_id)),None) if project_id else None\n if project_id and p is None:raise ValueError('Unknown project')\n lines=['# Kompas \u00b7 '+KINDS[kind],'','Datum: '+time.strftime('%Y-%m-%d %H:%M UTC',time.gmtime()),'','> Deterministische rapportage; geen echte AI. Menselijke verificatie vereist.','', '## Scope en toestemming',p['scope'] if p else 'Alleen mau2 read-only metadata / afgescheiden fictieve demo.',p['consent'] if p else 'Geen toestemming voor wijzigingen afgeleid uit dit rapport.','','## Vastgestelde feiten','| Asset | Type | Bron / zekerheid |','|---|---|---|']\n def cell(v):return str(v).replace('|','\\\\|').replace('\\n',' ')\n for a in s['assets'][:100]:lines.append('| '+ ' | '.join(cell(x) for x in (a['name'],a['kind'],a['facts'].get('source',a['facts'].get('confidence','onbekend'))))+' |')\n sections={'technical':['Technische bevindingen','Capaciteit en continu\u00efteit'],'inventory':['Inventaris en eigenaar','Afhankelijkheden'],'risk':['Risicoprioriteiten','Mitigaties'],'advice':['Aanbevelingen','Prioriteit en vervolgstappen'],'installation':['Uitvoeringsplan','Rollbackplan','Validatiecriteria'],'management':['Managementbeeld','Beslissingen en prioriteiten'],'delivery':['Uitgevoerde werkzaamheden (registratie)','Validatie','Nazorg']}\n for title in sections[kind]:\n  key={'Uitvoeringsplan':'execution_plan','Rollbackplan':'rollback_plan','Nazorg':'aftercare','Aanbevelingen':'recommendations','Risicoprioriteiten':'risks','Validatie':'report'}.get(title,'findings')\n  lines+=['','## '+title,p.get(key,'') if p and p.get(key) else 'Nog te verifi\u00ebren / vast te leggen; geen conclusie zonder bewijs.']\n lines+=['','## Afgeleide conclusies']\n for risk in app.DemoAdvisor().analyze(s)['risks']:lines+=['- **'+risk['priority']+'** '+risk['title']+' \u2014 bron: '+risk['evidence']]\n lines+=['','## Aannames','Geen automatische risicoacceptatie. Metadatarelaties bewijzen geen netwerkflows.','','## Nog te verifi\u00ebren','SMART/hostbronversheid, end-to-end beschikbaarheid, off-host herstel en klantisolatie afzonderlijk beoordelen.','','## Menselijke beslissing',p.get('approved_by','Niet vastgelegd') if p else 'Niet vastgelegd','Geen uitvoeringsfunctie. Goedkeuring is uitsluitend registratie, nooit automatische systeemwijziging.']\n return '\\n'.join(lines)+'\\n'\ndef print_html(markdown):\n return '<!doctype html><html lang=\"nl\"><meta charset=\"utf-8\"><title>Kompas rapport</title><style>body{font:12pt system-ui;max-width:900px;margin:40px auto;color:#182540}pre{white-space:pre-wrap;font:inherit;line-height:1.6}@media print{body{margin:15mm}a{display:none}}</style><a href=\"#\">Gebruik browser Afdrukken \u2192 Opslaan als PDF</a><pre>'+html.escape(markdown)+'</pre></html>'\ndef handler(base):\n class V1Handler(base):\n  def do_GET(self):\n   if not self.validhost():return self.send(403,{'error':'Local operator access only'})\n   u=urllib.parse.urlsplit(self.path);q=urllib.parse.parse_qs(u.query)\n   try:\n    if u.path=='/api/projects':return self.send(200,{'projects':projects(),'steps':STEPS,'statuses':STATUSES})\n    if u.path=='/api/monitoring':return self.send(200,monitor())\n    if u.path=='/api/report':\n     text=report(q.get('dataset',['demo'])[0],q.get('kind',['management'])[0],q.get('project',[None])[0]);printing=q.get('format',[''])[0]=='print'\n     return self.send(200,print_html(text) if printing else text,'text/html; charset=utf-8' if printing else 'text/markdown; charset=utf-8')\n    if u.path=='/api/runbook':return self.send(200,'# Restore\\nGeen live data overschrijven. Herstel eerst ge\u00efsoleerd met root-only Restic-toegang; verifieer hashes, SQLite en Git. Volg docs/server/it-discovery/README.md in server2-platform. Off-host kopie en wachtwoordescrow vereist voor hostverlies.','text/markdown; charset=utf-8')\n   except (ValueError,KeyError):return self.send(400,{'error':'Invalid request'})\n   return super().do_GET()\n  def do_POST(self):\n   path=urllib.parse.urlsplit(self.path).path\n   if path not in ('/api/projects','/api/toolkit'):return super().do_POST()\n   try:\n    if not self.validhost() or self.headers.get('Origin')!='http://'+self.headers.get('Host',''):return self.send(403,{'error':'Local origin required'})\n    size=int(self.headers.get('Content-Length','0'))\n    if not 0<size<=app.MAX_BODY:return self.send(413,{'error':'Invalid size'})\n    data=json.loads(self.rfile.read(size))\n    if path=='/api/toolkit':\n     if data.get('schema')!='kompas.discovery.v1' or data.get('source_host')!='mau2' or data.get('consent') is not True or data.get('read_only') is not True:raise ValueError('Unapproved scope')\n     rows=data['assets']\n     if not isinstance(rows,list) or len(rows)>50:raise ValueError('Invalid rows')\n     with app.db() as c:\n      for row in rows:\n       if row.get('kind')!='host' or row.get('name')!='mau2' or not isinstance(row.get('facts'),dict):raise ValueError('Unexpected host')\n       allowed={'os','kernel','architecture','cpu_count','memory','root_filesystem','source'}\n       if set(row['facts'])-allowed:raise ValueError('Unexpected facts')\n       facts=dict(row['facts'],source='Operator-import; unverified facts',confidence='unverified-import')\n       c.execute('INSERT OR REPLACE INTO assets VALUES(?,?,?,?,?,?)',('toolkit-mau2','toolkit','mau2','host',json.dumps(facts),time.time()))\n     return self.send(200,{'imported':len(rows),'dataset':'toolkit','verified':False})\n    id=save_project(data);return self.send(200,{'id':id,'execution_enabled':False})\n   except (ValueError,TypeError,KeyError):return self.send(400,{'error':'Invalid fictional project or missing approval/scope'})\n   except Exception:return self.send(503,{'error':'Save unavailable; retry safely'})\n return V1Handler\n",
    "app.py": "\"\"\"Read-only discovery/advisory demo. Stdlib only; never executes changes.\"\"\"\nimport hashlib,csv,io,json,os,sqlite3,threading,time,re,html,subprocess,ssl,urllib.request,urllib.parse,ipaddress\nfrom pathlib import Path\nfrom http.server import ThreadingHTTPServer,BaseHTTPRequestHandler\nROOT=Path(__file__).resolve().parent;DB=Path(os.environ.get('DISCOVERY_DB',str(ROOT/'.local/inventory.sqlite')));DB.parent.mkdir(parents=True,exist_ok=True)\nLOCK=threading.Lock();STOP=threading.Event();MAX_BODY=262144\nDEADLINE='2026-10-20T17:19:30Z'\nclass ClosingConnection(sqlite3.Connection):\n def __exit__(self,*args):\n  try:return super().__exit__(*args)\n  finally:self.close()\ndef db():\n c=sqlite3.connect(DB,timeout=10,factory=ClosingConnection);c.row_factory=sqlite3.Row;return c\ndef init():\n with db() as c:\n  c.executescript('''CREATE TABLE IF NOT EXISTS assets(id TEXT PRIMARY KEY,dataset TEXT,name TEXT,kind TEXT,facts TEXT,observed REAL);CREATE TABLE IF NOT EXISTS edges(dataset TEXT,source TEXT,target TEXT,relation TEXT,confirmed INTEGER);CREATE TABLE IF NOT EXISTS samples(time REAL,cpu REAL,memory REAL);CREATE TABLE IF NOT EXISTS cases(id INTEGER PRIMARY KEY,title TEXT,status TEXT,approved_by TEXT DEFAULT '',created REAL);CREATE TABLE IF NOT EXISTS audit(time REAL,event TEXT,details TEXT);''')\n  if not c.execute(\"SELECT 1 FROM assets WHERE dataset='demo'\").fetchone():\n   for i,(name,kind,osname) in enumerate([('MKB Demo BV','organisatie','fictief'),('kantoor.test','host','Linux demo'),('werkplek-01.test','host','Windows demo'),('crm.test','app','CRM demo'),('backup.test','service','Backup demo'),('switch.test','netwerk','onbevestigd')]):\n    c.execute('INSERT INTO assets VALUES(?,?,?,?,?,?)',('demo-'+str(i),'demo',name,kind,json.dumps({'os':osname,'ip':'192.0.2.'+str(i+10),'owner':'Fictief MKB','confidence':'synthetic','backup_verified':i!=3}),time.time()))\n   c.executemany('INSERT INTO edges VALUES(?,?,?,?,?)',[('demo','demo-1','demo-0','onderdeel',1),('demo','demo-2','demo-0','onderdeel',1),('demo','demo-3','demo-1','draait op',1),('demo','demo-4','demo-3','beschermt mogelijk',0)])\ndef read_kube(resource):\n paths={'nodes':'/api/v1/nodes','namespaces':'/api/v1/namespaces','pods':'/api/v1/pods','services':'/api/v1/services','pvcs':'/api/v1/persistentvolumeclaims','deployments':'/apis/apps/v1/deployments','metrics':'/apis/metrics.k8s.io/v1beta1/nodes','podmetrics':'/apis/metrics.k8s.io/v1beta1/pods'}\n path=paths[resource]\n if os.environ.get('DISCOVERY_MODE','local')=='local':\n  context=subprocess.run(['kubectl','--context','server2','config','view','--minify','-o','jsonpath={.clusters[0].cluster.server}'],capture_output=True,text=True,timeout=8)\n  if context.returncode or context.stdout!='https://192.168.0.162:6443':raise RuntimeError('Server2 endpoint mismatch')\n  p=subprocess.run(['kubectl','--context','server2','--request-timeout=6s','get','--raw',path],capture_output=True,text=True,timeout=9)\n  if p.returncode:raise RuntimeError('Read-only discovery unavailable: '+resource)\n  return json.loads(p.stdout)\n token=Path('/var/run/secrets/kubernetes.io/serviceaccount/token').read_text().strip();ctx=ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')\n url='https://'+os.environ['KUBERNETES_SERVICE_HOST']+':'+os.environ.get('KUBERNETES_SERVICE_PORT','443')+path\n with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+token}),context=ctx,timeout=6) as r:return json.load(r)\ndef quantity(value,kind):\n match=re.fullmatch(r'([0-9]+(?:\\.[0-9]+)?)([A-Za-z]*)',value)\n if not match:raise ValueError('Invalid metric quantity')\n number=float(match[1]);unit=match[2]\n units={'n':1e-6,'u':.001,'m':1,'':1000} if kind=='cpu' else {'':1/1048576,'Ki':1/1024,'Mi':1,'Gi':1024,'K':1000/1048576,'M':1000000/1048576,'G':1000000000/1048576}\n if unit not in units:raise ValueError('Unknown metric unit')\n return number*units[unit]\ndef collect():\n assets=[];edges=[];now=time.time()\n def add(id,name,kind,facts):assets.append((id,'live',name,kind,json.dumps(facts),now))\n node=read_kube('nodes')['items'];pods=read_kube('pods')['items'];services=read_kube('services')['items'];ns=read_kube('namespaces')['items'];deploy=read_kube('deployments')['items'];pvcs=read_kube('pvcs')['items']\n for n in node:\n  info=n['status']['nodeInfo'];add(n['metadata']['uid'],n['metadata']['name'],'node',{'ip':'192.168.0.162','os':info['osImage'],'kernel':info['kernelVersion'],'k3s':info['kubeletVersion'],'runtime':info['containerRuntimeVersion'],'capacity':n['status']['capacity'],'ready':any(x['type']=='Ready' and x['status']=='True' for x in n['status']['conditions']),'owner':'Maurice','source':'Kubernetes API','smart':'unknown; root inspection required'})\n for n in ns:add(n['metadata']['uid'],n['metadata']['name'],'namespace',{'source':'Kubernetes API','owner':'Maurice'})\n for d in deploy:add(d['metadata']['uid'],d['metadata']['namespace']+'/'+d['metadata']['name'],'deployment',{'namespace':d['metadata']['namespace'],'replicas':d['spec'].get('replicas',1),'ready':d['status'].get('readyReplicas',0),'images':[c['image'] for c in d['spec']['template']['spec']['containers']],'source':'Kubernetes API'})\n podusage={}\n try:\n  for metric in read_kube('podmetrics')['items']:\n   podusage[(metric['metadata']['namespace'],metric['metadata']['name'])]={'cpu_m':sum(quantity(c['usage']['cpu'],'cpu') for c in metric['containers']),'memory_mib':sum(quantity(c['usage']['memory'],'memory') for c in metric['containers']),'metrics_time':metric.get('timestamp')}\n except Exception:pass\n nodeids={n['metadata']['name']:n['metadata']['uid'] for n in node};nsids={n['metadata']['name']:n['metadata']['uid'] for n in ns}\n for p in pods:\n  id=p['metadata']['uid'];namespace=p['metadata']['namespace'];status=p['status'];add(id,namespace+'/'+p['metadata']['name'],'pod',{'namespace':namespace,'phase':status['phase'],'ready':all(x.get('ready') for x in status.get('containerStatuses',[])) and bool(status.get('containerStatuses')),'restarts':sum(x.get('restartCount',0) for x in status.get('containerStatuses',[])),'images':[c['image'] for c in p['spec']['containers']],'usage':podusage.get((namespace,p['metadata']['name']),{'status':'UNKNOWN'}),'source':'Kubernetes API'})\n  if p['spec'].get('nodeName') in nodeids:edges.append(('live',id,nodeids[p['spec']['nodeName']],'draait op',1))\n  edges.append(('live',id,nsids[namespace],'namespace',1))\n for s in services:\n  id=s['metadata']['uid'];add(id,s['metadata']['namespace']+'/'+s['metadata']['name'],'service',{'namespace':s['metadata']['namespace'],'type':s['spec']['type'],'ip':s['spec'].get('clusterIP'),'ports':[p['port'] for p in s['spec'].get('ports',[])],'source':'Kubernetes API'})\n  selector=s['spec'].get('selector',{})\n  if selector:\n   for p in pods:\n    if p['metadata']['namespace']==s['metadata']['namespace'] and all(p['metadata'].get('labels',{}).get(k)==v for k,v in selector.items()):edges.append(('live',id,p['metadata']['uid'],'selector-match; geen actieve flowmeting',1))\n for p in pvcs:add(p['metadata']['uid'],p['metadata']['namespace']+'/'+p['metadata']['name'],'pvc',{'phase':p['status']['phase'],'capacity':p['status'].get('capacity'),'storageclass':p['spec'].get('storageClassName'),'source':'Kubernetes API'})\n with LOCK,db() as c:\n  c.execute(\"DELETE FROM assets WHERE dataset='live'\");c.execute(\"DELETE FROM edges WHERE dataset='live'\");c.executemany('INSERT INTO assets VALUES(?,?,?,?,?,?)',assets);c.executemany('INSERT INTO edges VALUES(?,?,?,?,?)',edges)\n  try:\n   m=read_kube('metrics')['items'][0]['usage'];cpu=quantity(m['cpu'],'cpu');mem=quantity(m['memory'],'memory');c.execute('INSERT INTO samples VALUES(?,?,?)',(now,cpu,mem));c.execute('DELETE FROM samples WHERE time<?',(now-14*86400,))\n  except Exception:pass\n  c.execute('INSERT INTO audit VALUES(?,?,?)',(now,'discovery','read-only Kubernetes metadata; no Secret/config/env data'));c.execute('DELETE FROM audit WHERE time<?',(now-14*86400,))\n return len(assets)\ndef background():\n while not STOP.is_set():\n  try:\n   collect()\n  except Exception as e:\n   with db() as c:c.execute('INSERT INTO audit VALUES(?,?,?)',(time.time(),'discovery_error',type(e).__name__))\n  try:\n   import features\n   if hasattr(features,'app'):features.sample()\n  except Exception as e:\n   with db() as c:c.execute('INSERT INTO audit VALUES(?,?,?)',(time.time(),'monitoring_error',type(e).__name__))\n  STOP.wait(60)\ndef state(dataset='live'):\n if dataset not in ('live','demo','toolkit'):raise ValueError('Invalid dataset')\n with db() as c:\n  assets=[dict(x) for x in c.execute('SELECT * FROM assets WHERE dataset=? ORDER BY kind,name',(dataset,))]\n  for a in assets:a['facts']=json.loads(a['facts'])\n  return {'dataset':dataset,'assets':assets,'edges':[dict(x) for x in c.execute('SELECT * FROM edges WHERE dataset=?',(dataset,))],'history':[dict(x) for x in c.execute('SELECT * FROM samples ORDER BY time DESC LIMIT 120')][::-1],'cases':[dict(x) for x in c.execute('SELECT * FROM cases ORDER BY id DESC')],'audit':[dict(x) for x in c.execute('SELECT time,event,details FROM audit ORDER BY time DESC LIMIT 30')],'postkamer_deadline':DEADLINE,'external_ai':False,'execution_enabled':False}\nclass DemoAdvisor:\n def analyze(self,s):\n  risks=[{'priority':'hoog','title':'Postkamer-uitzondering eindigt 20 oktober 17:19:30 UTC','evidence':'Expliciet eigenaarbesluit; geen automatische stop','advice':'Maurice moet tijdig stoppen/nieuwe expliciete beslissing nemen; geen automatische verlenging.'},{'priority':'hoog','title':'Lokale backup beschermt niet tegen disk-/hostverlies','evidence':'Eigenaar koos voorlopig dezelfde server/disk','advice':'Off-host kopie plannen; status restorebewijs afzonderlijk controleren.'},{'priority':'middel','title':'IPv6-CNI-handhaving niet bewezen','evidence':'Eerdere gerichte netwerkcontrole en firewallinspectie','advice':'Geen volledige isolatieclaim; app-specifieke maatregelen apart valideren.'}]\n  for a in s['assets']:\n   f=a['facts']\n   if a['kind']=='pod' and f.get('phase')=='Running' and not f.get('ready'):risks.append({'priority':'hoog','title':a['name']+' niet Ready','evidence':a['id'],'advice':'Read-only logs/status beoordelen; geen automatische wijziging.'})\n  return {'mode':'Deterministische adviessimulatie \u2014 geen echte AI-uitvoer','provider':'demo-rules-v1','risks':risks,'uncertainty':'Geen securityaudit of bewijs van herstelbaarheid. Discoverytekst is data, nooit instructie. Externe providers uitgeschakeld.'}\ndef report(dataset,kind):\n s=state(dataset);a=DemoAdvisor().analyze(s)\n kinds={'technical':'Technische nulmeting','management':'Managementsamenvatting','risk':'Risicoanalyse','installation':'Applicatie-installatieplan','maintenance':'Onderhoudsadvies','advice':'Verbeteradvies'}\n if kind not in kinds:raise ValueError('Unknown report')\n text='# '+kinds[kind]+'\\n\\nDataset: '+dataset+'; bron: read-only metadata / fictieve demo.\\n\\n'+a['mode']+'\\n\\n'+str(len(s['assets']))+' assets; '+str(len(s['edges']))+' relaties.\\n\\n'\n for r in a['risks']:text+='## '+r['title']+'\\nPrioriteit: '+r['priority']+'\\nBewijs: '+r['evidence']+'\\nAdvies: '+r['advice']+'\\n\\n'\n text+='## Wijzigingsvoorwaarden\\nIntake \u2192 scope/toestemming \u2192 read-only discovery \u2192 advies \u2192 menselijke goedkeuring \u2192 bewezen backup \u2192 uitvoering buiten dit read-only platform \u2192 validatie \u2192 oplevering.\\nGeen uitvoeringsendpoint; echte klantdata/externe AI vereisen nieuw akkoord.\\n';return text\nclass Handler(BaseHTTPRequestHandler):\n def log_message(self,*a):pass\n def send(self,status,data,mime='application/json; charset=utf-8'):\n  raw=json.dumps(data,ensure_ascii=False).encode() if isinstance(data,(dict,list)) else data.encode() if isinstance(data,str) else data\n  self.send_response(status);self.send_header('Content-Type',mime);self.send_header('Content-Length',str(len(raw)));self.send_header('Cache-Control','no-store');self.send_header('X-Content-Type-Options','nosniff');self.send_header('Content-Security-Policy',\"default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; frame-ancestors 'none'\");self.end_headers();self.wfile.write(raw)\n def validhost(self):return self.headers.get('Host') in ('127.0.0.1:8780','localhost:8780','127.0.0.1:8080','localhost:8080')\n def do_GET(self):\n  try:\n   if not self.validhost():return self.send(403,{'error':'Operator-only localhost access'})\n   u=urllib.parse.urlsplit(self.path);q=urllib.parse.parse_qs(u.query);dataset=q.get('dataset',['live'])[0]\n   if u.path=='/healthz':return self.send(200,{'status':'ok','read_only':True,'external_ai':False})\n   if u.path=='/api/state':return self.send(200,state(dataset))\n   if u.path=='/api/advice':return self.send(200,DemoAdvisor().analyze(state(dataset)))\n   if u.path=='/api/report':return self.send(200,report(dataset,q.get('kind',['management'])[0]),'text/markdown; charset=utf-8')\n   if u.path=='/api/export':\n    assets=state(dataset)['assets']\n    if q.get('format',['json'])[0]=='csv':\n     f=io.StringIO();w=csv.writer(f);w.writerow(['id','name','kind','observed']);w.writerows([[str(a[k]) if not str(a[k]).startswith(('=','+','-','@')) else \"'\"+str(a[k]) for k in ['id','name','kind','observed']] for a in assets]);return self.send(200,f.getvalue(),'text/csv; charset=utf-8')\n    return self.send(200,assets)\n   files={'/':'index.html','/app.js':'app.js','/style.css':'style.css','/v1.js':'v1.js'}\n   if u.path in files:return self.send(200,(ROOT/'static'/files[u.path]).read_bytes(),{'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8'}[Path(files[u.path]).suffix])\n   self.send(404,{'error':'Not found'})\n  except (ValueError,KeyError):self.send(400,{'error':'Invalid request'})\n  except Exception:self.send(503,{'error':'Temporarily unavailable; no internal details'})\n def do_POST(self):\n  try:\n   if not self.validhost() or self.headers.get('Origin')!='http://'+self.headers.get('Host',''):return self.send(403,{'error':'Local origin required'})\n   n=int(self.headers.get('Content-Length','0'))\n   if not 0<n<=MAX_BODY:return self.send(413,{'error':'Invalid size'})\n   data=json.loads(self.rfile.read(n));path=urllib.parse.urlsplit(self.path).path\n   if path=='/api/cases':\n    title=data['title'];\n    if not isinstance(title,str) or not 1<=len(title)<=160:raise ValueError('Invalid title')\n    with db() as c:c.execute('INSERT INTO cases(title,status,created) VALUES(?,?,?)',(title,'intake',time.time()))\n    return self.send(201,{'status':'recorded','execution_enabled':False})\n   if path=='/api/import':\n    rows=list(csv.DictReader(io.StringIO(data['text']))) if data.get('format')=='csv' else data['assets'];\n    if data.get('synthetic') is not True:raise ValueError('Synthetic attestation required')\n    if not isinstance(rows,list) or len(rows)>200:raise ValueError('Invalid rows')\n    with db() as c:\n     for row in rows:\n      name=row['name'];kind=row['kind'];\n      if not isinstance(name,str) or not 1<=len(name)<=120 or kind not in ('host','app','service','netwerk'):raise ValueError('Invalid asset')\n      c.execute('INSERT OR REPLACE INTO assets VALUES(?,?,?,?,?,?)',('import-'+hashlib.sha256(name.encode()).hexdigest()[:20],'demo',name,kind,json.dumps({'source':'user-import synthetic','confidence':'unconfirmed'}),time.time()))\n    return self.send(200,{'imported':len(rows),'dataset':'demo'})\n   self.send(405,{'error':'System execution is disabled'})\n  except Exception:self.send(400,{'error':'Invalid input; no action executed'})\ndef main():\n init();import features,sys;features.setup(sys.modules[__name__]);threading.Thread(target=background,daemon=True).start();server=ThreadingHTTPServer((os.environ.get('DISCOVERY_BIND','127.0.0.1'),int(os.environ.get('DISCOVERY_PORT','8780'))),features.handler(Handler))\n try:server.serve_forever()\n finally:STOP.set();server.server_close()\nif __name__=='__main__':main()\n",
    "ipv4_guard.py": "\"\"\"AMD64 process-scoped Linux seccomp guard; inherited across exec and threads.\nUses kernel classic BPF through libc; no host profile or privilege changes.\n\"\"\"\nimport ctypes,errno,json,os,platform,socket,sys\nfrom pathlib import Path\nclass Filter(ctypes.Structure):\n _fields_=[('code',ctypes.c_ushort),('jt',ctypes.c_ubyte),('jf',ctypes.c_ubyte),('k',ctypes.c_uint32)]\nclass Program(ctypes.Structure):\n _fields_=[('length',ctypes.c_ushort),('filters',ctypes.POINTER(Filter))]\ndef status():\n values=dict(line.split(':',1) for line in Path('/proc/self/status').read_text().splitlines() if ':' in line)\n return {k:values[k].strip() for k in ('NoNewPrivs','Seccomp','Seccomp_filters','CapEff','CapPrm','CapAmb')}\ndef install():\n if platform.machine()!='x86_64':raise RuntimeError('Unsupported architecture')\n before=status()\n if before['NoNewPrivs']!='1' or before['Seccomp']!='2':raise RuntimeError('Missing base restrictions')\n if any(int(before[k],16) for k in ('CapEff','CapPrm','CapAmb')):raise RuntimeError('Unexpected capabilities')\n if len(os.listdir('/proc/self/task'))!=1:raise RuntimeError('Guard must precede threads')\n for fd in Path('/proc/self/fd').iterdir():\n  try:target=os.readlink(fd)\n  except FileNotFoundError:continue\n  if target.startswith('socket:'):raise RuntimeError('Inherited socket descriptor')\n # seccomp_data: arch at 4, syscall at 0, low 32 bits of args[0] at 16.\n # Reject non-amd64 and x32 ABI; deny AF_INET6 for socket and socketpair.\n rules=[(0x20,0,0,4),(0x15,1,0,0xc000003e),(0x06,0,0,0x80000000),\n        (0x20,0,0,0),(0x45,0,1,0x40000000),(0x06,0,0,0x80000000),\n        (0x15,1,0,41),(0x15,0,3,53),(0x20,0,0,16),\n        (0x15,0,1,10),(0x06,0,0,0x00050000|errno.EAFNOSUPPORT),\n        (0x06,0,0,0x7fff0000)]\n array=(Filter*len(rules))(*(Filter(*r) for r in rules));program=Program(len(rules),array)\n libc=ctypes.CDLL(None,use_errno=True);libc.prctl.argtypes=[ctypes.c_int,ctypes.c_ulong,ctypes.c_ulong,ctypes.c_ulong,ctypes.c_ulong];libc.prctl.restype=ctypes.c_int\n if libc.prctl(22,2,ctypes.addressof(program),0,0)!=0:raise RuntimeError('Seccomp load failed')\n after=status()\n if int(after['Seccomp_filters'])<=int(before['Seccomp_filters']):raise RuntimeError('Filter not proven')\n try:s=socket.socket(socket.AF_INET6)\n except OSError as e:\n  if e.errno!=errno.EAFNOSUPPORT:raise\n else:s.close();raise RuntimeError('IPv6 denial failed')\n with socket.socket(socket.AF_INET):pass\n return {'before':before,'after':after,'ipv6':'EAFNOSUPPORT','ipv4':'socket allowed'}\nif __name__=='__main__':\n if sys.argv[1:] not in ([],['--self-test']):raise SystemExit('Unsupported invocation')\n print(json.dumps({'ipv4_guard':install()}),flush=True)\n if sys.argv[1:]==['--self-test']:raise SystemExit(0)\n os.execv(sys.executable,[sys.executable,'-B',str(Path(__file__).with_name('app.py'))])\n",
    "v1.js": "'use strict';\nlet projectData={projects:[],steps:[],statuses:[]},monitorData={},selectedProject=null;\nconst labels={customer:'Fictieve klantnaam',description:'Opdrachtomschrijving',scope:'Scope',consent:'Vastgelegde toestemming',assets:'Assets',findings:'Bevindingen',risks:'Risico\u2019s',recommendations:'Aanbevelingen',approved_by:'Menselijke beslissing \u2014 naam en toelichting',execution_plan:'Uitvoeringsplan (alleen registratie)',rollback_plan:'Rollbackplan',report:'Validatie en oplevering',aftercare:'Nazorg'};\nconst date=x=>x?new Date(x*1000).toLocaleString('nl-NL'):'Onbekend',bytes=x=>Number.isFinite(x)?(x/1073741824).toFixed(1)+' GiB':'Onbekend';\nfunction monitoring(){const h=monitorData.host||{},m=h.memory||{},fs=h.filesystems||[],network=h.network||{},io=h.disk_io||{};return `<div class=\"panel\"><h2>Monitoring \u00b7 actuele bron en onzekerheden</h2>${pill(monitorData.stale?'Metingen ontbreken / verouderd':'Actuele hostmetingen',monitorData.stale)}<p>Laatste hostmeting: ${date(h.time)} \u00b7 uptime ${h.uptime_seconds?Math.floor(h.uptime_seconds/3600)+' uur':'onbekend'}</p><p>RAM beschikbaar ${bytes(m.MemAvailable)} / ${bytes(m.MemTotal)}. CPU/RAM-trend: zie Overzicht.</p><h3>Kubernetes \u00b7 pod resources</h3><div class=\"tablewrap\"><table><tr><th>Pod</th><th>Ready</th><th>Restarts</th><th>CPU / RAM</th></tr>${(data.assets||[]).filter(a=>a.kind==='pod'&&a.facts.phase!=='Succeeded').map(a=>`<tr><td>${esc(a.name)}</td><td>${a.facts.ready?'Ready':esc(a.facts.phase)}</td><td>${a.facts.restarts}</td><td>${a.facts.usage?.cpu_m!==undefined?Math.round(a.facts.usage.cpu_m)+'m / '+Math.round(a.facts.usage.memory_mib)+' MiB':'Onbekend'}</td></tr>`).join('')}</table></div><h3>Filesystems</h3>${fs.map(f=>`<div class=\"row\"><b>${esc(f.path)}</b><span>${f.percent}% gebruikt \u00b7 ${bytes(f.free)} vrij / ${bytes(f.total)}</span></div>`).join('')||'<p>Hostcollector nog niet aangesloten.</p>'}<h3>Beschikbaarheid</h3>${Object.entries(h.availability||{}).map(([name,r])=>`<div class=\"row\"><b>${esc(name)}</b>${pill(r.status,r.status!=='PASS')}<small>${date(r.time)}</small></div>`).join('')||'<p>Geen HTTP/DNS-metingen beschikbaar.</p>'}<h3>SSD / SMART</h3><p>${esc(h.smart?.status||'UNKNOWN')} \u00b7 ${esc(h.smart?.reason||'')} \u00b7 temperatuur ${esc(h.smart?.temperature??'onbekend')} \u00b0C</p><details><summary>Netwerk- en disk-I/O-tellers</summary><pre>${esc(JSON.stringify({network,disk_io:io},null,2))}</pre><p>Cumulatieve bytes; geen gemeten snelheden of netwerkflowbewijs.</p></details><p class=\"muted\">${esc(monitorData.pvc_usage)}. ${esc(monitorData.availability_scope)}.</p></div><div class=\"panel\"><h2>Waarschuwingen en herstel</h2><p>${esc(monitorData.hysteresis)}</p>${(monitorData.alerts||[]).filter(a=>a.active||a.bad).map(a=>`<div class=\"row\"><span>${esc(a.message)}</span>${pill(a.active?'ALARM':a.bad?'Bevestiging afwachten':'Geen alarm',a.active)}<small>${date(a.observed)}</small></div>`).join('')||'<p>Geen actieve of voorlopige alarmen. Controleer bronversheid en meetdekking hierboven.</p>'}<p class=\"muted\">Telefoonmeldingen: ${esc(monitorData.notifications)}.</p></div>`}\nfunction backup(){const b=monitorData.host?.backup||{},last=b['last-success']||(b.status==='PASS'?b:{});return `<div class=\"panel\"><h2>Backup & recovery</h2><p class=\"banner\">Lokale backup aanwezig \u2014 geen bescherming tegen fysieke disk- of serveruitval.</p>${pill(b.status||'UNKNOWN',b.status!=='PASS'||monitorData.stale)}<p>Laatste resultaat: ${date(b.time)} \u00b7 bron ${monitorData.stale?'verouderd / ontbreekt':'actueel'}.</p><p>Laatste succes: ${date(last.time)}. Laatste fout: ${date(b['last-failure']?.time)}.</p><p>Dagelijkse timer: ${b.timer_active===true?'Actief':'Onbekend / niet actief'}. Retentie: ${esc(b.retention||'onbekend')}.</p><p>Repository: ${esc(b.repository||'/var/backups/restic')} \u00b7 bestanden geverifieerd: ${esc(b.files_restored_verified??'onbekend')}.</p><p>SQLite-integriteit: ${esc(b.sqlite_integrity||'onbekend')} \u00b7 Git fsck: ${esc(b.git_fsck||'onbekend')}.</p><p>Dit betreft een ge\u00efsoleerde bestandsrestore; geen volledig opgestarte disaster-recoverytest.</p><a href=\"/api/runbook\" target=\"_blank\" rel=\"noopener\">Restore-runbook openen \u2197</a><h3>Off-host vervolgstap</h3><p>Kies een afzonderlijke disk/host of objectopslag, leg bewaartermijn en kosten vast, maak een beperkte credential buiten Git en test herstel. Geen externe bestemming ingesteld. Bewaar het recoverywachtwoord veilig buiten mau2.</p></div>`}\nchanges=function(){const p=projectData.projects.find(p=>p.id===selectedProject)||{steps:projectData.steps.map(()=>projectData.statuses[0])};return `<div class=\"panel\"><h2>IT-adviesworkflow \u00b7 fictieve projecten</h2><p class=\"banner\">Alleen fictieve gegevens. Goedkeuring en uitvoering zijn registraties; Kompas voert geen systeemwijzigingen uit.</p><div class=\"tools\"><select id=\"project-select\"><option value=\"\">Nieuwe fictieve opdracht</option>${projectData.projects.map(x=>`<option value=\"${x.id}\" ${x.id===selectedProject?'selected':''}>${esc(x.customer)}</option>`).join('')}</select><span id=\"save-status\" role=\"status\"></span></div><form id=\"project-form\"><div class=\"formgrid\">${Object.entries(labels).map(([k,label])=>`<label>${label}${k==='customer'?`<input name=\"${k}\" required maxlength=\"120\" value=\"${esc(p[k]||'')}\">`:`<textarea name=\"${k}\" maxlength=\"6000\" rows=\"2\">${esc(p[k]||'')}</textarea>`}</label>`).join('')}</div><h3>Voortgang</h3><div class=\"steps\">${projectData.steps.map((label,i)=>`<label><b>${i+1}. ${esc(label)}</b><select name=\"step${i}\">${projectData.statuses.map(status=>`<option ${p.steps?.[i]===status?'selected':''}>${esc(status)}</option>`).join('')}</select></label>`).join('')}</div><button type=\"submit\">Project en voortgang opslaan</button></form></div>`};\nreports=function(){return `<p class=\"banner\">Deterministische rapportage \u00b7 feiten, conclusies, aannames en verificatie apart. Voor PDF: open printversie en kies Afdrukken \u2192 Opslaan als PDF.</p><label>Project <select id=\"report-project\"><option value=\"\">Algemene ${esc(data.dataset)} inventaris</option>${projectData.projects.map(p=>`<option value=\"${p.id}\">${esc(p.customer)}</option>`).join('')}</select></label><div class=\"reports\">${Object.entries({technical:'Technische nulmeting',inventory:'IT-inventarisatie',risk:'Security-risicoanalyse',advice:'Verbeteradvies',installation:'Implementatieplan',management:'Managementsamenvatting',delivery:'Opleverrapport'}).map(([k,v])=>`<article class=\"panel\"><h3>${v}</h3><a data-report=\"${k}\" href=\"/api/report?dataset=${data.dataset}&kind=${k}\" target=\"_blank\" rel=\"noopener\">Markdown \u2197</a> \u00b7 <a data-report=\"${k}\" data-print=\"yes\" href=\"/api/report?dataset=${data.dataset}&kind=${k}&format=print\" target=\"_blank\" rel=\"noopener\">Print / PDF \u2197</a></article>`).join('')}</div>`};\nconst originalRender=render;\nrender=function(){if(view==='monitoring'||view==='backup'){$('#view').innerHTML=view==='monitoring'?monitoring():backup()}else if(view==='changes'){$('#view').innerHTML=changes()}else originalRender();if(view==='changes'){const select=$('#project-select');select.onchange=()=>{selectedProject=select.value?Number(select.value):null;render()};$('#project-form').onsubmit=async event=>{event.preventDefault();const f=new FormData(event.target),body={synthetic:true,steps:projectData.steps.map((_,i)=>f.get('step'+i))};for(const k of Object.keys(labels))body[k]=f.get(k);if(selectedProject)body.id=selectedProject;try{const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){$('#save-status').textContent='Niet opgeslagen: controleer toestemming, menselijke beslissing en plannen.';return}selectedProject=(await r.json()).id;projectData=await (await fetch('/api/projects')).json();render();$('#save-status').textContent='Opgeslagen \u2014 geen systeemactie uitgevoerd.'}catch{$('#save-status').textContent='Opslaan mislukt; invoer blijft staan.'}}}if(view==='reports')$('#report-project').onchange=e=>document.querySelectorAll('[data-report]').forEach(a=>{a.href='/api/report?dataset='+data.dataset+'&kind='+a.dataset.report+(e.target.value?'&project='+e.target.value:'')+(a.dataset.print?'&format=print':'')})};\nconst originalLoad=load;\nload=async function(){if(document.activeElement?.matches('#project-form input,#project-form textarea,#project-form select'))return;try{[projectData,monitorData]=await Promise.all(['/api/projects','/api/monitoring'].map(async p=>{const r=await fetch(p);if(!r.ok)throw Error();return r.json()}));await originalLoad()}catch{$('#notice').textContent='Metingen tijdelijk niet beschikbaar; geen actuele PASS-claim.'}};\ndocument.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});$('#dataset').onchange=load;$('#refresh').onclick=load;load();\n",
    "app.js": "'use strict';\nconst $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));let data={},advice={},view='overview';\nconst kindLabel={node:'Server',namespace:'Namespace',deployment:'Applicatie',pod:'Pod',service:'Service',pvc:'Opslag',host:'Host',app:'Applicatie',netwerk:'Netwerk',organisatie:'Organisatie'};\nconst pill=(text,warn=false)=>`<span class=\"pill ${warn?'warn':''}\">${esc(text)}</span>`;\nfunction openAsset(id){const a=data.assets.find(x=>x.id===id);if(!a)return;$('#detail-body').innerHTML=`<span class=\"eyebrow\">${esc(kindLabel[a.kind]||a.kind)}</span><h2>${esc(a.name)}</h2><p>Laatst waargenomen: ${new Date(a.observed*1000).toLocaleString('nl-NL')}</p><pre>${esc(JSON.stringify(a.facts,null,2))}</pre><p>Onbekende gegevens zijn niet als feiten bevestigd.</p>`;$('#detail').showModal()}\nfunction bindAssets(){document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>openAsset(b.dataset.asset))}\nfunction spark(){const samples=data.history||[];if(samples.length<2)return '<p class=\"muted\">Historie wordt iedere minuut verzameld. Nog onvoldoende meetpunten.</p>';const vals=samples.map(x=>x.cpu),max=Math.max(100,...vals),path=vals.map((y,i)=>(i?'L':'M')+(i*600/(vals.length-1)).toFixed(1)+','+(110-y/max*95).toFixed(1)).join(' ');return `<svg class=\"spark\" viewBox=\"0 0 600 120\" role=\"img\" aria-label=\"CPU-historie\"><path d=\"${path}\"/></svg><p class=\"muted\">CPU in millicores \u00b7 maximaal 14 dagen retentie \u00b7 ${samples.length} recente meetpunten</p>`}\nfunction overview(){const a=data.assets||[],pods=a.filter(x=>x.kind==='pod'&&x.facts.phase!=='Succeeded'),bad=pods.filter(x=>x.facts.phase==='Running'&&!x.facts.ready),node=a.find(x=>x.kind==='node'),last=(data.history||[]).slice(-1)[0];return `<div class=\"stats\"><div class=\"stat\"><span>Assets in beeld</span><b>${a.length}</b></div><div class=\"stat\"><span>Pods ${bad.length?'met aandacht':'gereed'}</span><b>${pods.filter(x=>x.facts.ready).length}/${pods.length}</b></div><div class=\"stat\"><span>CPU-gebruik</span><b>${last?Math.round(last.cpu)+'m':'\u2014'}</b></div><div class=\"stat\"><span>RAM gebruikt</span><b>${last?Math.round(last.memory)+' MiB':'\u2014'}</b></div></div><div class=\"grid\"><div><div class=\"panel\"><h2>Jouw server, \u00e9\u00e9n helder beeld</h2><div class=\"row\"><div><b>${esc(node?.name||'Fictieve omgeving')}</b><p class=\"muted\">${esc(node?.facts.os||'Geen geverifieerde hostmeting')}</p></div>${pill(node?.facts.ready?'Node Ready':'Demo / onbekend',!node?.facts.ready)}</div><p>Kubernetes ${esc(node?.facts.k3s||'\u2014')} \u00b7 ${esc(node?.facts.runtime||'\u2014')}</p><p class=\"muted\">Host- en backupmetingen staan op Monitoring en Backup & recovery; onbekende waarden blijven expliciet onbekend.</p></div><div class=\"panel\"><h2>Capaciteit door de tijd</h2>${spark()}</div></div><div><div class=\"panel\"><h2>Applicaties & diensten</h2>${a.filter(x=>x.kind==='deployment').map(x=>`<div class=\"row\"><button data-asset=\"${esc(x.id)}\">${esc(x.name)}</button>${pill(x.facts.ready+'/'+x.facts.replicas+' Ready',x.facts.ready<x.facts.replicas)}</div>`).join('')||'<p>Gebruik de assets voor deze demo.</p>'}</div><div class=\"panel\"><h2>Volgende veilige stap</h2><p>Controleer actuele backupstatus en beoordeel het advies; voer nooit automatisch wijzigingen uit.</p>${pill('Menselijke goedkeuring vereist',true)}</div></div></div>`}\nfunction assets(){return `<div class=\"panel\"><h2>Inventaris \u2014 feiten met herkomst</h2><input id=\"search\" placeholder=\"Zoek op naam, soort of namespace\" aria-label=\"Assets zoeken\"><div class=\"tools\"><label>Fictieve JSON/CSV import <input id=\"import-file\" type=\"file\" accept=\".json,.csv\"></label><a href=\"/api/export?dataset=${$('#dataset').value}&format=json\">JSON export</a><a href=\"/api/export?dataset=${$('#dataset').value}&format=csv\">CSV export</a></div><div class=\"tablewrap\"><table><thead><tr><th>Asset</th><th>Type</th><th>Status / bron</th><th>Waarneming</th></tr></thead><tbody id=\"rows\"></tbody></table></div></div>`}\nfunction assetRows(query=''){const rows=(data.assets||[]).filter(a=>(a.name+' '+a.kind+' '+(a.facts.namespace||'')).toLowerCase().includes(query.toLowerCase()));$('#rows').innerHTML=rows.map(a=>`<tr><td><button data-asset=\"${esc(a.id)}\">${esc(a.name)}</button></td><td>${esc(kindLabel[a.kind]||a.kind)}</td><td>${esc(a.facts.phase||a.facts.source||a.facts.confidence||'Onbekend')}</td><td>${new Date(a.observed*1000).toLocaleTimeString('nl-NL')}</td></tr>`).join('');bindAssets()}\nfunction topology(){const shown=(data.assets||[]).filter(x=>!['service','pvc'].includes(x.kind)).slice(0,35),pos=new Map(shown.map((x,i)=>[x.id,{x:30+(i%5)*190,y:30+Math.floor(i/5)*65}]));return `<div class=\"panel\"><h2>Relaties, geen veronderstelde netwerkflows</h2><p class=\"muted\">Doorgetrokken: metadata bevestigd. Gestippeld: onbevestigd. Klik voor brongegevens. Maximaal 35 assets in deze overzichtsweergave.</p><svg class=\"topology\" viewBox=\"0 0 1000 520\">${(data.edges||[]).filter(e=>pos.has(e.source)&&pos.has(e.target)).map(e=>{const a=pos.get(e.source),b=pos.get(e.target);return `<line class=\"edge ${e.confirmed?'':'unknown'}\" x1=\"${a.x+80}\" y1=\"${a.y+18}\" x2=\"${b.x+80}\" y2=\"${b.y+18}\"><title>${esc(e.relation)}</title></line>`}).join('')}${shown.map(a=>{const p=pos.get(a.id);return `<g data-asset=\"${esc(a.id)}\"><rect x=\"${p.x}\" y=\"${p.y}\" width=\"165\" height=\"38\" rx=\"8\"/><text x=\"${p.x+10}\" y=\"${p.y+23}\">${esc(a.name.slice(0,23))}</text></g>`}).join('')}</svg></div>`}\nfunction risks(){return `<div class=\"panel\"><h2>Advies met bewijs en onzekerheid</h2><p class=\"banner\">${esc(advice.mode)} \u00b7 geen externe provider of gegevensoverdracht.</p>${(advice.risks||[]).map(r=>`<article class=\"risk ${r.priority==='hoog'?'high':''}\"><h3>${esc(r.title)}</h3>${pill(r.priority,true)}<p><b>Bewijs:</b> ${esc(r.evidence)}</p><p>${esc(r.advice)}</p></article>`).join('')}<p class=\"muted\">${esc(advice.uncertainty)}</p></div>`}\nfunction changes(){return `<div class=\"panel\"><h2>Van intake naar verantwoorde oplevering</h2><div class=\"flow\">${['Intake','Scope & toestemming','Read-only discovery','Visualisatie','Advies','Menselijke goedkeuring','Backup','Handmatige uitvoering','Validatie','Oplevering'].map(x=>`<span>${x}</span>`).join('')}</div><p>Deze versie registreert intake en produceert plannen. Uitvoering is bewust niet aangesloten; er is geen shell-, installatie- of klantproductie-endpoint.</p><form id=\"case-form\"><input id=\"case-title\" maxlength=\"160\" required placeholder=\"Fictieve intake / wijzigingsvraag\"><button>Intake registreren</button></form>${(data.cases||[]).map(c=>`<div class=\"row\"><b>${esc(c.title)}</b>${pill(c.status,true)}</div>`).join('')}</div><div class=\"panel\"><h2>Audit van read-only waarnemingen</h2>${(data.audit||[]).slice(0,10).map(x=>`<div class=\"row\"><span>${esc(x.event)}</span><span class=\"muted\">${esc(x.details)} \u00b7 ${new Date(x.time*1000).toLocaleTimeString()}</span></div>`).join('')}</div>`}\nfunction reports(){return `<p class=\"banner\">Rapporten zijn deterministische demo\u2019s. Controleer feiten, bronverwijzingen en onzekerheden voordat je ze deelt.</p><div class=\"reports\">${Object.entries({technical:'Technische nulmeting',management:'Managementsamenvatting',risk:'Risicoanalyse',installation:'Installatieplan',maintenance:'Onderhoudsadvies',advice:'Verbeteradvies'}).map(([k,v])=>`<a href=\"/api/report?dataset=${$('#dataset').value}&kind=${k}\" target=\"_blank\" rel=\"noopener\"><span class=\"eyebrow\">MARKDOWN RAPPORT</span><h3>${v} \u2197</h3><p>Feiten \u00b7 risico\u2019s \u00b7 veilige vervolgstappen</p></a>`).join('')}</div>`}\nfunction render(){const map={overview,assets,topology,risks,changes,reports};$('#view').innerHTML=map[view]();bindAssets();if(view==='assets'){assetRows();$('#search').oninput=e=>assetRows(e.target.value);$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text(),payload=f.name.endsWith('.csv')?{format:'csv',text,synthetic:true}:{assets:JSON.parse(text),synthetic:true};const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error();$('#dataset').value='demo';await load()}catch{alert('Import mislukt: gebruik uitsluitend fictieve assets met name en kind.')}}}if(view==='changes')$('#case-form').onsubmit=async e=>{e.preventDefault();await fetch('/api/cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('#case-title').value})});await load()};const last=Math.max(0,...(data.assets||[]).map(x=>x.observed));$('#footer').textContent=`${data.dataset==='demo'?'Volledig fictieve klantdemo':'Read-only mau2 / Kubernetes'} \u00b7 laatste assetwaarneming ${last?new Date(last*1000).toLocaleString('nl-NL'):'nog niet beschikbaar'} \u00b7 geen multi-tenant beveiligingslaag`}\nasync function load(){try{const ds=$('#dataset').value;const responses=await Promise.all([fetch('/api/state?dataset='+ds),fetch('/api/advice?dataset='+ds)]);if(responses.some(r=>!r.ok))throw Error('Niet beschikbaar');[data,advice]=await Promise.all(responses.map(r=>r.json()));$('#notice').innerHTML='<div class=\"banner\">Postkamer blijft gepauzeerd voor ontwikkeling. De tijdelijke uitzondering eindigt 20 oktober 2026, 17:19:30 UTC. Geen automatische stop of verlenging.</div>';render()}catch(e){$('#notice').textContent='Discovery tijdelijk niet beschikbaar. Geen actuele PASS-claim; probeer opnieuw.'}}\ndocument.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});$('#dataset').onchange=load;$('#refresh').onclick=load;$('#close').onclick=()=>$('#detail').close();load();setInterval(()=>load(),30000);\n",
    "style.css": ":root{--bg:#f3f5fa;--ink:#202d49;--muted:#69768e;--line:#e3e8f2;--accent:#4164dd;--teal:#178f8b;--red:#ba4b5f;--amber:#9a6b14}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif;display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid var(--line);padding:30px 22px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;color:var(--accent);font-size:32px;font-weight:800}.brand span{font-size:25px;color:var(--ink)}small{display:block;font-size:11px;color:var(--muted);font-weight:500}.scope{margin-top:50px;padding:16px;background:#f5f7fc;border-radius:12px;font-size:12px}.scope p{color:var(--muted);margin-bottom:0}nav{display:grid;gap:8px;margin-top:42px}button,select,input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--accent)}nav button{text-align:left;background:transparent;border-color:transparent;padding:12px;font-size:14px}nav button.active{background:#edf1ff;color:var(--accent);font-weight:650}main{padding:36px clamp(20px,4vw,64px);max-width:1700px;width:100%}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}h1{font-size:clamp(25px,3vw,35px);line-height:1.2;margin:7px 0 10px;letter-spacing:-.8px}h2{font-size:19px;margin:0 0 16px}h3{font-size:15px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--accent)}p{color:var(--muted)}header p{margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:24px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 4px 20px #24375b04}.stat span{color:var(--muted);font-size:12px}.stat b{display:block;font-size:30px;margin-top:7px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}.panel{margin-bottom:20px}.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;background:#e9f7f4;color:#167863}.pill.warn{color:var(--amber);background:#fff5dd}.pill.bad{color:var(--red);background:#fff0f2}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row button{padding:4px 9px;font-size:12px}.muted{color:var(--muted);font-size:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}td button{border:0;padding:0;color:var(--accent);text-align:left}.tablewrap{overflow:auto}#search{width:min(100%,420px);margin-bottom:16px}.spark{width:100%;height:120px}.spark path{stroke:var(--accent);fill:none;stroke-width:2}.risk{border-left:3px solid var(--amber);padding:10px 18px;margin-bottom:20px}.risk.high{border-color:var(--red)}.risk h3{margin:0 0 8px}.risk p{margin:5px 0;font-size:13px}.banner{padding:14px 18px;background:#fff5dd;color:#775820;border:1px solid #f3e4bc;border-radius:12px;margin-bottom:18px;font-size:13px}.flow{display:flex;flex-wrap:wrap;gap:8px}.flow span{padding:10px 12px;background:#f1f4fc;border-radius:8px;font-size:12px}.flow span:after{content:' \u2192';color:var(--accent)}.flow span:last-child:after{content:''}.reports{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.reports a{text-decoration:none;color:var(--ink);background:#fff;padding:24px;border:1px solid var(--line);border-radius:12px}.reports a:hover{border-color:var(--accent)}.topology{height:500px;width:100%}.topology .edge{stroke:#bcc8dd;stroke-width:2}.topology .unknown{stroke-dasharray:6 5}.topology rect{fill:#edf1ff;stroke:#d6def8}.topology text{fill:var(--ink);font-size:11px;pointer-events:none}.topology g{cursor:pointer}dialog{border:0;border-radius:18px;padding:28px;max-width:650px;width:90%;box-shadow:0 30px 100px #101b4060}dialog::backdrop{background:#0e1b3a55}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7fb;padding:15px;font-size:12px}footer{margin-top:24px;font-size:12px;color:var(--muted)}:focus-visible{outline:3px solid #7c97ff;outline-offset:2px}@media(max-width:1050px){body{grid-template-columns:205px 1fr}aside{padding:20px 12px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.reports{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){body{display:block}aside{position:static;height:auto;padding:15px}.brand{font-size:25px}nav{display:flex;overflow:auto;margin-top:15px;gap:3px}nav button{white-space:nowrap;font-size:12px}.scope{display:none}main{padding:22px 14px}.stats{gap:10px}.stat{padding:15px}.stat b{font-size:24px}.reports{grid-template-columns:1fr}.panel{padding:17px}.topology{height:430px}}\n\n.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.formgrid label,.steps label{display:flex;flex-direction:column;gap:7px;font-size:13px}.formgrid textarea{font:inherit;padding:10px;border:1px solid #d6def8;border-radius:8px;resize:vertical}.steps{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}@media(max-width:650px){.formgrid,.steps{grid-template-columns:1fr}}\n",
    "index.html": "<!doctype html><html lang=\"nl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Kompas \u00b7 IT Discovery & Advisory</title><link rel=\"stylesheet\" href=\"/style.css\"></head><body><aside><div class=\"brand\">\u25c8 <span>Kompas<small>IT Discovery & Advisory</small></span></div><nav><button data-view=\"overview\" class=\"active\">\u25eb Overzicht</button><button data-view=\"monitoring\">\u25c9 Monitoring</button><button data-view=\"backup\">\u25f4 Backup & recovery</button><button data-view=\"assets\">\u25a6 Assets & discovery</button><button data-view=\"topology\">\u2318 Relaties & topologie</button><button data-view=\"risks\">\u25c7 Risico\u2019s & advies</button><button data-view=\"changes\">\u2713 Werkproces</button><button data-view=\"reports\">\u25a4 Rapporten</button></nav><div class=\"scope\"><b>Scope: alleen mau2</b><p>Read-only \u00b7 geen LAN-scans<br>Geen externe AI of uitvoering</p></div></aside><main><header><div><span class=\"eyebrow\">JOUW DIGITALE GEREEDSCHAPSKIST</span><h1 id=\"heading\">Grip op je IT-landschap</h1><p id=\"subtitle\">Feiten, relaties en advies \u2014 met de mens aan het stuur.</p></div><div class=\"tools\"><select id=\"dataset\"><option value=\"live\">Live \u00b7 mau2</option><option value=\"toolkit\">Linux-toolkit \u00b7 ge\u00efmporteerd</option><option value=\"demo\">Fictief MKB \u00b7 demo</option></select><button id=\"refresh\">\u21bb Vernieuwen</button></div></header><div id=\"notice\" role=\"status\"></div><section id=\"view\"></section><footer id=\"footer\">Gegevens laden\u2026</footer></main><dialog id=\"detail\"><button id=\"close\">Sluiten \u00d7</button><div id=\"detail-body\"></div></dialog><script src=\"/app.js\"></script><script src=\"/v1.js\"></script></body></html>\n"
  }
}
