{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "postkamer-isolation",
    "namespace": "flux-system"
  },
  "spec": {
    "suspend": false,
    "interval": "10m",
    "retryInterval": "1m",
    "timeout": "5m",
    "path": "./kubernetes/apps/postkamer/isolation",
    "prune": true,
    "wait": true,
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    },
    "dependsOn": [
      {
        "name": "infrastructure"
      }
    ]
  }
}
