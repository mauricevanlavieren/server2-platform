---
- name: Configure k3s host prerequisites
  hosts: server2
  become: true
  gather_facts: true

  tasks:
    - name: Configure required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure k3s kernel parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-k3s.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        owner: root
        group: root
        mode: "0644"
      register: k3s_sysctl_config

    - name: Apply k3s kernel parameters
      ansible.builtin.command:
        cmd: sysctl --system
      when: k3s_sysctl_config.changed
      changed_when: true

    - name: Verify k3s kernel parameters
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables net.bridge.bridge-nf-call-ip6tables
      register: k3s_sysctl_values
      changed_when: false

    - name: Assert k3s kernel parameters
      ansible.builtin.assert:
        that:
          - k3s_sysctl_values.stdout_lines == ['1', '1', '1']
        fail_msg: "k3s kernel parameters are not configured correctly."
        success_msg: "k3s kernel prerequisites are configured correctly."
      when: not ansible_check_mode
