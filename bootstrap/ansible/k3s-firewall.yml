---
- name: Configure firewall for k3s
  hosts: server2
  become: true
  gather_facts: true

  vars:
    lan_network: "192.168.0.0/24"
    k3s_pod_cidr: "10.42.0.0/16"
    k3s_service_cidr: "10.43.0.0/16"

  tasks:
    - name: Allow Kubernetes API from trusted LAN
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp
        src: "{{ lan_network }}"
        comment: "k3s Kubernetes API - trusted LAN"

    - name: Allow routed traffic from k3s pod network
      community.general.ufw:
        rule: allow
        route: true
        src: "{{ k3s_pod_cidr }}"
        comment: "k3s pod routed traffic"

    - name: Allow routed traffic to k3s pod network
      community.general.ufw:
        rule: allow
        route: true
        dest: "{{ k3s_pod_cidr }}"
        comment: "k3s pod routed traffic"

    - name: Verify UFW remains enabled
      ansible.builtin.command:
        cmd: ufw status verbose
      register: ufw_status
      changed_when: false
      when: not ansible_check_mode

    - name: Assert UFW is active
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"
        fail_msg: "UFW is not active."
        success_msg: "UFW remains active with the k3s firewall configuration."
      when: not ansible_check_mode
