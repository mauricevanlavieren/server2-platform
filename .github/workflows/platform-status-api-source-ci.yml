name: Platform Status API tests and audit
'on':
  pull_request:
    branches: [main]
    paths:
      - 'applications/platform-status-api/**'
      - '.github/workflows/platform-status-api-source-ci.yml'
  push:
    branches: [main]
    paths:
      - 'applications/platform-status-api/**'
      - '.github/workflows/platform-status-api-source-ci.yml'
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
    working-directory: applications/platform-status-api
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Locked install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
